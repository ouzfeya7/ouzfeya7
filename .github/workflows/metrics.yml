name: GitHub Metrics

on:
  schedule:
    - cron: "0 */12 * * *"
  push:
    branches:
      - main
    paths:
      - 'scripts/generate_all_stats.py'
      - '.github/workflows/metrics.yml'
  workflow_dispatch:

jobs:
  github-metrics:
    runs-on: ubuntu-latest
    permissions:
      contents: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install dependencies
        run: pip install requests

      - name: Generate all metrics SVGs
        env:
          GH_TOKEN: ${{ secrets.GH_TOKEN }}
        run: python scripts/generate_all_stats.py

      - name: Commit & push
        run: |
          git config user.email "action@github.com"
          git config user.name "GitHub Actions"
          git pull --rebase --autostash
          git add metrics/
          git diff --staged --quiet || git commit -m "Update metrics SVGs [ci skip]"
          git push
